<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>漢字の組み立て マスター</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background: #f0f8f2;
  color: #333;
}

/* --------------------
   タイトル
-------------------- */

h1 {
  text-align: center;
  color: #2e7d32;
  margin: 5px 0 15px;
  font-size: 28px;
}

/* --------------------
   タブ
-------------------- */

.tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 15px;
}

.tab {
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 17px;
  font-weight: bold;
  background: #d7ead9;
  color: #356b3b;
  cursor: pointer;
}

.tab.active {
  background: #4caf50;
  color: white;
}

/* --------------------
   共通
-------------------- */

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.panel {
  max-width: 1000px;
  margin: auto;
  background: white;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

/* --------------------
   パズル上部
-------------------- */

.instruction {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.progress {
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  color: #388e3c;
  margin-bottom: 12px;
}

/* --------------------
   選択エリア
-------------------- */

.combine-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin: 10px auto 18px;
}

.slot {
  width: 110px;
  height: 110px;
  border: 3px dashed #9ccc9f;
  border-radius: 18px;
  background: #f8fff8;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 52px;
  font-weight: bold;
}

.plus {
  font-size: 38px;
  font-weight: bold;
  color: #777;
}

.result {
  min-width: 130px;
  height: 110px;
  border-radius: 18px;
  background: #e8f5e9;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  font-weight: bold;
}

.result-kanji {
  font-size: 54px;
  line-height: 1;
}

.result-text {
  font-size: 14px;
  margin-top: 5px;
  color: #555;
}

/* --------------------
   ボタン
-------------------- */

.button-area {
  text-align: center;
  margin-bottom: 15px;
}

button.main-button {
  border: none;
  border-radius: 12px;
  padding: 13px 28px;
  margin: 4px;

  font-size: 18px;
  font-weight: bold;

  background: #4caf50;
  color: white;
  cursor: pointer;
}

button.main-button:disabled {
  background: #c8d8ca;
  cursor: default;
}

button.reset-button {
  background: #78909c;
}

/* --------------------
   カード
-------------------- */

.card-area {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 9px;
  margin-top: 15px;
}

.card {
  aspect-ratio: 1 / 1;

  background: white;
  border: 3px solid #81c784;
  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 34px;
  font-weight: bold;

  cursor: pointer;

  user-select: none;
  -webkit-user-select: none;

  box-shadow: 0 2px 5px rgba(0,0,0,0.08);

  transition:
    transform 0.1s,
    background 0.1s,
    border-color 0.1s;
}

.card:active {
  transform: scale(0.94);
}

.card.selected {
  background: #fff59d;
  border-color: #f9a825;
  transform: scale(1.04);
}

/* 間違い */

.card-area.wrong .card.selected {
  animation: shake 0.35s;
}

@keyframes shake {

  0%   { transform: translateX(0); }
  25%  { transform: translateX(-7px); }
  50%  { transform: translateX(7px); }
  75%  { transform: translateX(-5px); }
  100% { transform: translateX(0); }

}

/* --------------------
   完成した漢字
-------------------- */

.completed-area {
  margin-top: 20px;
  padding: 12px;
  background: #f5fbf5;
  border-radius: 14px;
}

.completed-title {
  text-align: center;
  font-weight: bold;
  color: #388e3c;
  margin-bottom: 8px;
}

.completed-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}

.completed-kanji {
  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #c8e6c9;
  border-radius: 10px;

  font-size: 28px;
  font-weight: bold;
}

/* --------------------
   完成画面
-------------------- */

.complete-message {
  text-align: center;
  padding: 30px 10px;
}

.complete-message .big {
  font-size: 60px;
}

.complete-message h2 {
  font-size: 32px;
  color: #2e7d32;
}

.complete-message p {
  font-size: 20px;
}

/* --------------------
   クイズ
-------------------- */

.quiz-progress {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  color: #388e3c;
  margin: 8px 0 15px;
}

.quiz-question {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin: 20px 0;
  line-height: 1.5;
}

.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(120px, 300px));
  justify-content: center;
  gap: 12px;
}

.quiz-option {
  border: 3px solid #81c784;
  border-radius: 14px;
  padding: 18px;

  background: white;

  font-size: 24px;
  font-weight: bold;

  cursor: pointer;
}

.quiz-option:hover {
  background: #f1f8e9;
}

.quiz-option:disabled {
  cursor: default;
}

.quiz-option.correct {
  background: #c8e6c9;
  border-color: #43a047;
}

.quiz-option.wrong {
  background: #ffcdd2;
  border-color: #e53935;
}

.quiz-result {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  margin: 18px 0;
  min-height: 60px;
  line-height: 1.5;
}

/* --------------------
   クイズ終了画面
-------------------- */

.quiz-finish {
  text-align: center;
  padding: 30px 10px;
}

.quiz-finish .big {
  font-size: 65px;
}

.quiz-finish h2 {
  font-size: 32px;
  color: #2e7d32;
  margin: 10px 0 20px;
}

.quiz-score {
  display: inline-block;
  background: #e8f5e9;
  color: #2e7d32;
  border-radius: 16px;
  padding: 15px 28px;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 15px;
}

.quiz-finish p {
  font-size: 20px;
}

/* --------------------
   iPadなど
-------------------- */

@media (max-width: 900px) {

  .card-area {
    grid-template-columns: repeat(6, 1fr);
  }

}

@media (max-width: 600px) {

  body {
    padding: 8px;
  }

  h1 {
    font-size: 23px;
  }

  .panel {
    padding: 10px;
  }

  .combine-area {
    gap: 8px;
  }

  .slot,
  .result {
    width: 85px;
    height: 85px;
  }

  .slot {
    font-size: 40px;
  }

  .result-kanji {
    font-size: 42px;
  }

  .card-area {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .card {
    font-size: 27px;
    border-width: 2px;
  }

  .quiz-question {
    font-size: 22px;
  }

  .quiz-options {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .quiz-option {
    font-size: 20px;
    padding: 15px;
  }

  .quiz-score {
    font-size: 26px;
  }

}

/* iPad横向き */

@media (min-width: 768px) and (max-width: 1200px) {

  .card-area {
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
  }

  .card {
    font-size: 38px;
  }

}

</style>
</head>

<body>

<h1>📖 漢字の組み立て マスター</h1>

<div class="tabs">

  <button class="tab active"
          onclick="switchTab('puzzle')">
    ① カード合体パズル
  </button>

  <button class="tab"
          onclick="switchTab('quiz')">
    ② 部首の意味クイズ
  </button>

</div>


<!-- =================================
     ① カード合体パズル
================================= -->

<div id="puzzleScreen" class="screen active">

  <div class="panel">

    <div class="instruction">
      カードを2つ選んで、漢字を作ろう！
    </div>

    <div class="progress" id="progress">
      のこり 20 こ
    </div>

    <div class="combine-area">

      <div class="slot" id="slot1"></div>

      <div class="plus">＋</div>

      <div class="slot" id="slot2"></div>

      <div class="result" id="resultBox">

        <div class="result-kanji" id="resultKanji">
          ？
        </div>

        <div class="result-text">
          できる漢字
        </div>

      </div>

    </div>


    <div class="button-area">

      <button
        class="main-button"
        id="combineButton"
        onclick="checkCombine()"
        disabled>
        🔍 組み合わせる
      </button>

      <button
        class="main-button reset-button"
        onclick="resetSlots()">
        ↩️ 選びなおす
      </button>

      <button
        class="main-button reset-button"
        onclick="resetGame()">
        🔄 はじめから
      </button>

    </div>


    <div id="cardArea" class="card-area"></div>


    <div class="completed-area">

      <div class="completed-title">
        🎉 できた漢字
      </div>

      <div
        id="completedList"
        class="completed-list">
      </div>

    </div>


    <div
      id="completeMessage"
      class="complete-message"
      style="display:none;">

      <div class="big">🎉</div>

      <h2>コンプリート！</h2>

      <p>
        20この漢字を全部完成させました！
      </p>

      <button
        class="main-button"
        onclick="resetGame()">
        🔄 もう一度挑戦
      </button>

    </div>

  </div>

</div>


<!-- =================================
     ② 部首の意味クイズ
================================= -->

<div id="quizScreen" class="screen">

  <div class="panel">

    <!-- クイズ本体 -->

    <div id="quizGame">

      <div class="instruction">
        部首の意味を考えよう！
      </div>

      <div
        id="quizProgress"
        class="quiz-progress">
        第1問 / 15問
      </div>

      <div
        id="quizQuestion"
        class="quiz-question">
      </div>

      <div
        id="quizOptions"
        class="quiz-options">
      </div>

      <div
        id="quizResult"
        class="quiz-result">
      </div>

      <div class="button-area">

        <button
          id="nextQuizButton"
          class="main-button"
          onclick="nextQuiz()"
          style="display:none;">
          次の問題 →
        </button>

      </div>

    </div>


    <!-- クイズ終了 -->

    <div
      id="quizFinish"
      class="quiz-finish"
      style="display:none;">

      <div class="big">
        🎉
      </div>

      <h2>
        クイズ終了！
      </h2>

      <div
        id="quizScore"
        class="quiz-score">
      </div>

      <p>
        よくがんばりました！
      </p>

      <button
        class="main-button"
        onclick="restartQuiz()">
        🔄 もう一度挑戦
      </button>

    </div>

  </div>

</div>


<script>

/* =================================
   漢字データ
================================= */

const puzzleData = [

  {
    p1: '言',
    p2: '寺',
    res: '詩',
    type: 'ごんべん＋寺'
  },

  {
    p1: '羽',
    p2: '白',
    res: '習',
    type: '羽＋白'
  },

  {
    p1: '牛',
    p2: '勿',
    res: '物',
    type: 'うしへん＋勿'
  },

  {
    p1: '癶',
    p2: '豆',
    res: '登',
    type: 'はつがしら＋豆'
  },

  {
    p1: '手',
    p2: '寺',
    res: '持',
    type: 'てへん＋寺'
  },

  {
    p1: '女',
    p2: '台',
    res: '始',
    type: 'おんなへん＋台'
  },

  {
    p1: '重',
    p2: '力',
    res: '動',
    type: '重＋力'
  },

  {
    p1: '門',
    p2: '口',
    res: '問',
    type: 'もんがまえ＋口'
  },

  {
    p1: '水',
    p2: '胡',
    res: '湖',
    type: 'さんずい＋胡'
  },

  {
    p1: '水',
    p2: '酉',
    res: '酒',
    type: '水＋酉（ひよみのとり）',
    radical: '酉（ひよみのとり）'
  },

  {
    p1: '木',
    p2: '目',
    res: '相',
    type: 'きへん＋目'
  },

  {
    p1: '水',
    p2: '羊',
    res: '洋',
    type: 'さんずい＋羊'
  },

  {
    p1: '禾',
    p2: '火',
    res: '秋',
    type: 'のぎへん＋火'
  },

  {
    p1: '人',
    p2: '士',
    res: '仕',
    type: 'にんべん＋士'
  },

  {
    p1: '束',
    p2: '辶',
    res: '速',
    type: '束＋しんにょう'
  },

  {
    p1: '木',
    p2: '黄',
    res: '横',
    type: 'きへん＋黄'
  },

  {
    p1: '金',
    p2: '失',
    res: '鉄',
    type: 'かねへん＋失'
  },

  {
    p1: '手',
    p2: '合',
    res: '拾',
    type: 'てへん＋合'
  },

  {
    p1: '糸',
    p2: '東',
    res: '練',
    type: 'いとへん＋東'
  },

  {
    p1: '木',
    p2: '直',
    res: '植',
    type: 'きへん＋直'
  }

];


/* =================================
   ゲーム用変数
================================= */

let selectedCards = [];

let completedPuzzles = [];

let cards = [];


/* =================================
   カードを作る
================================= */

function createCardPool() {

  const pool = [];

  puzzleData.forEach((puzzle, index) => {

    pool.push({
      char: puzzle.p1
    });

    pool.push({
      char: puzzle.p2
    });

  });

  return pool;

}


/* =================================
   配列シャッフル
================================= */

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
      [array[j], array[i]];

  }

  return array;

}


/* =================================
   ゲーム開始
================================= */

function initPuzzle() {

  selectedCards = [];

  completedPuzzles = [];

  cards = createCardPool();

  shuffle(cards);

  document
    .getElementById('completeMessage')
    .style.display = 'none';

  document
    .getElementById('cardArea')
    .style.display = 'grid';

  resetSlots();

  createCards();

  updateProgress();

  updateCompletedList();

}


/* =================================
   カード表示
================================= */

function createCards() {

  const area =
    document.getElementById('cardArea');

  area.innerHTML = '';

  cards.forEach((card, index) => {

    const div =
      document.createElement('div');

    div.className = 'card';

    div.textContent = card.char;

    div.dataset.index = index;

    div.addEventListener(
      'click',
      () => selectCard(div, index)
    );

    area.appendChild(div);

  });

}


/* =================================
   カード選択
================================= */

function selectCard(element, index) {

  if (selectedCards.length >= 2) {
    return;
  }

  if (
    selectedCards.some(
      card => card.index === index
    )
  ) {
    return;
  }

  element.classList.add('selected');

  selectedCards.push({
    index: index,
    char: cards[index].char,
    element: element
  });

  if (selectedCards.length === 1) {

    document.getElementById('slot1')
      .textContent =
      selectedCards[0].char;

  }

  if (selectedCards.length === 2) {

    document.getElementById('slot2')
      .textContent =
      selectedCards[1].char;

  }

  updateCombineButton();

}


/* =================================
   組み合わせボタン
================================= */

function updateCombineButton() {

  document.getElementById('combineButton')
    .disabled =
    selectedCards.length !== 2;

}


/* =================================
   正解判定
================================= */

function checkCombine() {

  if (selectedCards.length !== 2) {
    return;
  }

  const char1 =
    selectedCards[0].char;

  const char2 =
    selectedCards[1].char;

  const puzzleIndex =
    puzzleData.findIndex(puzzle => {

      return (
        (
          puzzle.p1 === char1 &&
          puzzle.p2 === char2
        )
        ||
        (
          puzzle.p1 === char2 &&
          puzzle.p2 === char1
        )
      );

    });

  if (
    puzzleIndex !== -1 &&
    completedPuzzles.includes(puzzleIndex)
  ) {

    showWrong();

    return;

  }


  /* -------------------------------
     正解
  -------------------------------- */

  if (puzzleIndex !== -1) {

    const puzzle =
      puzzleData[puzzleIndex];

    document.getElementById('resultKanji')
      .textContent =
      puzzle.res;

    selectedCards.forEach(card => {

      card.element.remove();

    });

    completedPuzzles.push(puzzleIndex);

    updateProgress();

    updateCompletedList();

    setTimeout(() => {

      resetSlots();

      if (
        completedPuzzles.length ===
        puzzleData.length
      ) {

        showComplete();

      }

    }, 900);

  }


  /* -------------------------------
     間違い
  -------------------------------- */

  else {

    showWrong();

  }

}


/* =================================
   間違い表示
================================= */

function showWrong() {

  const area =
    document.getElementById('cardArea');

  area.classList.add('wrong');

  setTimeout(() => {

    area.classList.remove('wrong');

  }, 400);

}


/* =================================
   選びなおす
================================= */

function resetSlots() {

  selectedCards = [];

  document.getElementById('slot1')
    .textContent = '';

  document.getElementById('slot2')
    .textContent = '';

  document.getElementById('resultKanji')
    .textContent = '？';

  document
    .querySelectorAll('.card.selected')
    .forEach(card => {

      card.classList.remove('selected');

    });

  updateCombineButton();

}


/* =================================
   残り問題数
================================= */

function updateProgress() {

  const remaining =
    puzzleData.length -
    completedPuzzles.length;

  document.getElementById('progress')
    .textContent =
    `のこり ${remaining} こ`;

}


/* =================================
   完成した漢字
================================= */

function updateCompletedList() {

  const list =
    document.getElementById('completedList');

  list.innerHTML = '';

  completedPuzzles.forEach(index => {

    const item =
      document.createElement('div');

    item.className =
      'completed-kanji';

    item.textContent =
      puzzleData[index].res;

    list.appendChild(item);

  });

}


/* =================================
   コンプリート
================================= */

function showComplete() {

  document.getElementById('cardArea')
    .style.display = 'none';

  document.getElementById('completeMessage')
    .style.display = 'block';

}


/* =================================
   最初から
================================= */

function resetGame() {

  initPuzzle();

}


/* =================================
   タブ切り替え
================================= */

function switchTab(tab) {

  const puzzleScreen =
    document.getElementById('puzzleScreen');

  const quizScreen =
    document.getElementById('quizScreen');

  const tabs =
    document.querySelectorAll('.tab');

  tabs.forEach(tabButton => {

    tabButton.classList.remove('active');

  });


  if (tab === 'puzzle') {

    puzzleScreen.classList.add('active');

    quizScreen.classList.remove('active');

    tabs[0].classList.add('active');

  }

  else {

    puzzleScreen.classList.remove('active');

    quizScreen.classList.add('active');

    tabs[1].classList.add('active');

    initQuiz();

  }

}


/* =================================
   ② 部首の意味クイズ
================================= */

const quizData = [

  /* 1 */

  {
    kanji: '湖',

    question: '「湖」の部首は？',

    options: [
      'さんずい',
      'きへん',
      'にんべん',
      'ごんべん'
    ],

    answer: 'さんずい',

    meaning: '「さんずい」は、水に関係する意味を表す部首です。'
  },


  /* 2 */

  {
    kanji: '酒',

    question: '「酒」の部首は？',

    options: [
      'さんずい',
      'ひよみのとり',
      'きへん',
      'かねへん'
    ],

    answer: 'ひよみのとり',

    meaning: '「ひよみのとり（酉）」は、酒などに関係する漢字に使われます。'
  },


  /* 3 */

  {
    kanji: '相',

    question: '「相」の部首は？',

    options: [
      'きへん',
      'めへん',
      'さんずい',
      'てへん'
    ],

    answer: 'きへん',

    meaning: '「きへん」は、木や木に関係する意味を表す部首です。'
  },


  /* 4 */

  {
    kanji: '鉄',

    question: '「鉄」の部首は？',

    options: [

let currentQuiz = 0;

let quizScore = 0;


/* =================================
   クイズ開始
================================= */

function initQuiz() {

  currentQuiz = 0;

  quizScore = 0;

  document.getElementById('quizGame')
    .style.display = 'block';

  document.getElementById('quizFinish')
    .style.display = 'none';

  showQuiz();

}


/* =================================
   クイズ表示
================================= */

function showQuiz() {

  const quiz =
    quizData[currentQuiz];


  /* 問題番号 */

  document.getElementById('quizProgress')
    .textContent =
    `第${currentQuiz + 1}問 / ${quizData.length}問`;


  /* 問題 */

  document.getElementById('quizQuestion')
    .textContent =
    quiz.question;


  /* 選択肢 */

  const options =
    document.getElementById('quizOptions');

  options.innerHTML = '';


  quiz.options.forEach(option => {

    const button =
      document.createElement('button');

    button.className =
      'quiz-option';

    button.textContent =
      option;

    button.onclick =
      () => checkQuiz(option, button);

    options.appendChild(button);

  });


  /* 結果をリセット */

  document.getElementById('quizResult')
    .textContent = '';


  /* 次へボタンを隠す */

  document.getElementById('nextQuizButton')
    .style.display = 'none';

}


/* =================================
   クイズ判定
================================= */

function checkQuiz(answer, clickedButton) {

  const quiz =
    quizData[currentQuiz];


  const result =
    document.getElementById('quizResult');


  const buttons =
    document.querySelectorAll('.quiz-option');


  /*
    二重クリック防止
  */

  buttons.forEach(button => {

    button.disabled = true;

  });


  /* -------------------------------
     正解
  -------------------------------- */

  if (answer === quiz.answer) {

    quizScore++;

    clickedButton.classList.add('correct');

    result.textContent =
      `⭕ 正解！「${quiz.answer}」です。 ${quiz.meaning}`;

  }


  /* -------------------------------
     不正解
  -------------------------------- */

  else {

    clickedButton.classList.add('wrong');


    /*
      正解の選択肢を緑色にする
    */

    buttons.forEach(button => {

      if (
        button.textContent === quiz.answer
      ) {

        button.classList.add('correct');

      }

    });


    result.textContent =
      `❌ 正解は「${quiz.answer}」です。 ${quiz.meaning}`;

  }


  /* -------------------------------
     次のボタン
  -------------------------------- */

  const nextButton =
    document.getElementById('nextQuizButton');


  if (
    currentQuiz ===
    quizData.length - 1
  ) {

    nextButton.textContent =
      '結果を見る 🎉';

  }

  else {

    nextButton.textContent =
      '次の問題 →';

  }


  nextButton.style.display =
    'inline-block';

}


/* =================================
   次のクイズ
================================= */

function nextQuiz() {

  /*
    最後の問題なら
    終了画面へ
  */

  if (
    currentQuiz >=
    quizData.length - 1
  ) {

    finishQuiz();

    return;

  }


  currentQuiz++;

  showQuiz();

}


/* =================================
   クイズ終了
================================= */

function finishQuiz() {

  document.getElementById('quizGame')
    .style.display = 'none';

  document.getElementById('quizFinish')
    .style.display = 'block';


  document.getElementById('quizScore')
    .textContent =
    `${quizData.length}問中 ${quizScore}問正解！`;

}


/* =================================
   もう一度挑戦
================================= */

function restartQuiz() {

  initQuiz();

}


/* =================================
   起動
================================= */

window.onload = function() {

  initPuzzle();

};
